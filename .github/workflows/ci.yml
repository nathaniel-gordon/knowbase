name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares (>=3.11); the ceiling is what the repo is
        # developed on. The domain-purity test spawns a fresh interpreter, so it is checking
        # the same version the rest of the suite runs under.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest tests -q --cov=knowbase --cov-report=term --cov-fail-under=85

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build image
        run: docker build -t knowbase:ci .

      # The service must refuse an exposed bind without a token; a container that starts
      # here is a regression.
      - name: refuses to serve without KB_API_TOKEN
        run: |
          if docker run --rm knowbase:ci; then
            echo "started without a token" && exit 1
          fi

      - name: comes up healthy with a token
        run: |
          docker run -d --name smoke -e KB_API_TOKEN=ci-smoke-token-0123456789 knowbase:ci
          for i in $(seq 1 15); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1
