[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowbase"
version = "0.1.0"
description = "Hexagonal enterprise knowledge-base RAG: JSON microservice + typed client SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scikit-learn"]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest"]

[project.scripts]
knowbase = "knowbase.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:knowbase.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["output"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplification
    "RET",       # return style
    "PTH",       # prefer pathlib
    "BLE",       # blind except
    "N",         # naming
    "RUF",
]
ignore = [
    "N818",      # error classes here are named for the condition, not the suffix
    "RUF012",    # ClassVar annotations add noise to plain dict constants
]
# TID is deliberately not selected: package-relative imports are the house style, and
# tests/test_domain_purity.py reads them to decide which way the dependency arrow points.

[tool.ruff.lint.per-file-ignores]
# Tests deliberately catch broadly when the point is that nothing escaped.
"tests/**" = ["BLE001"]
# The stopword list reads as prose; 83 quoted list items would not.
"src/knowbase/domain/text.py" = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["knowbase"]

[tool.mypy]
python_version = "3.11"
files = ["src/knowbase"]
mypy_path = "src"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# numpy and scikit-learn are only reachable from adapters/index/_lexical.py, and neither
# ships types this build can use.
module = ["numpy.*", "sklearn.*", "anthropic.*"]
ignore_missing_imports = true
